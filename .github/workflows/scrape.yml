name: 自动抓取电力数据

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:  

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: 安装 Playwright 浏览器
        run: playwright install --with-deps chromium

      - name: 运行抓取脚本
        run: python scrape.py

      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 【修改点 2】改成了新的英文文件名
          git add power_data.csv comparison_chart.png
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新数据 $(date -u '+%Y-%m-%d %H:%M')"
          git push

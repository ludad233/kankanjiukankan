name: 自动抓取电力数据

on:
  schedule:
    # 每小时的第 0 分钟运行（UTC 时间，对应北京时间每小时的 08 分左右）
    - cron: '0 * * * *'
  workflow_dispatch:  # 允许手动点击运行

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须加这个，否则无法把新的数据提交回仓库

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: 安装 Playwright 浏览器
        run: playwright install --with-deps chromium

      - name: 运行抓取脚本
        run: python scrape.py

      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 将所有产生变化的文件添加到暂存区（不怕文件名写错了）
          git add .
          
          # 如果有变化则提交，如果没有变化就跳过
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新数据 $(date -u '+%Y-%m-%d %H:%M')"
          
          # 【关键修复】先拉取远端仓库最新的代码并合并，防止冲突
          git pull origin main --rebase
          
          # 最后推送
          git push

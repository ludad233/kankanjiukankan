name: 自动抓取电力数据

on:
  workflow_dispatch:     # 保留手动点击按钮
  repository_dispatch:   # 保留 cron-job.org 的外部唤醒

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: 安装 Playwright 浏览器
        run: playwright install --with-deps chromium

      - name: 运行抓取脚本
        run: python scrape.py

      - name: 提交更新后的数据
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新数据"
          # 【核心关键】：必须加上 history/*.png，否则每天的存档图不会被上传！
          file_pattern: "power_data.csv comparison_chart.png history/*.png"
